# Codemagic — build de iOS.
#
# SÓ iOS, DE PROPÓSITO.
# O Android é compilado no GitHub Actions (.github/workflows/android.yml),
# que é gratuito e ilimitado para repositório público. O plano gratuito do
# Codemagic dá 500 min/mês de macOS — recurso escasso e insubstituível,
# porque iOS não compila em mais lugar nenhum. Gastá-lo com Android seria
# desperdiçar o único que não tem alternativa.
#
# ESTE ARQUIVO PRECISA FICAR NA RAIZ DO REPOSITÓRIO.
# Já esteve em `app/` e o Codemagic respondeu "No configuration file found".
# Como o projeto Flutter vive em `app/`, o workflow declara
# `working_directory: app`, e os caminhos de artefato são relativos à RAIZ.
#
# CONFIGURAR ANTES DO PRIMEIRO BUILD:
#   Teams → Integrations → Apple Developer Portal
#   Grupo de variáveis 'app_store' → APP_STORE_APP_ID (App Store Connect)

workflows:
  # ───────────────────────────────────────────────────────────────────────
  ios:
    name: iOS — IPA
    max_build_duration: 90
    instance_type: mac_mini_m2    # o macOS alugado; é a razão deste arquivo
    working_directory: app
    environment:
      flutter: 3.29.2
      xcode: latest
      cocoapods: default
      groups:
        - app_store
      ios_signing:
        # O Codemagic cria e renova os perfis sozinho depois que a conta
        # Apple Developer estiver conectada na interface.
        distribution_type: app_store
        bundle_identifier: br.net.onebit.radioPortoDoCapim
    scripts:
      - name: Dependências
        script: flutter pub get

      - name: Análise estática
        script: flutter analyze

      - name: Testes
        script: flutter test

      - name: CocoaPods
        # just_audio e audio_service têm código nativo; sem o pod install o
        # build falha com "module not found".
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Perfis de assinatura
        script: xcode-project use-profiles

      - name: IPA
        script: |
          flutter build ipa --release \
            --build-number=$(($(app-store-connect get-latest-app-store-build-number "$APP_STORE_APP_ID") + 1))

    artifacts:
      - app/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - atendimento@1bit.net.br
        notify:
          success: true
          failure: true
      # Envio automático ao TestFlight. No primeiro build deixe comentado:
      # melhor baixar o IPA e conferir antes de mandar para a Apple.
      # app_store_connect:
      #   auth: integration
      #   submit_to_testflight: true
