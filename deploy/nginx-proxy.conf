# Template nginx do HestiaCP para o site da Web Rádio.
#
# Instalar como template do usuário e aplicar ao domínio:
#   /usr/local/hestia/data/templates/web/nginx/php-fpm/webradio.tpl
#   /usr/local/hestia/data/templates/web/nginx/php-fpm/webradio.stpl  (idêntico, bloco SSL)
#
# As variáveis %ip%, %domain%, %ssl_pem% etc. são substituídas pelo Hestia.

server {
    listen      %ip%:%web_ssl_port% ssl;
    server_name %domain_idn% %alias_idn%;

    ssl_certificate     %ssl_pem%;
    ssl_certificate_key %ssl_key%;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Uploads de mídia do Auto DJ: um álbum WAV passa fácil de 500 MB.
    client_max_body_size 2048m;

    # ─────────────────────────────────────────────────────────────────
    # Stream contínuo do Icecast (MP3/AAC)
    # ─────────────────────────────────────────────────────────────────
    location /listen/ {
        proxy_pass http://127.0.0.1:8005/;
        proxy_http_version 1.1;

        # CRÍTICO. Com buffering ligado o nginx acumula o áudio antes de
        # repassar, o que introduz atraso de dezenas de segundos e faz o
        # player estourar o buffer. Um stream infinito NUNCA pode ser
        # bufferizado por proxy.
        proxy_buffering off;
        proxy_request_buffering off;

        # Um ouvinte fica horas conectado; o padrão de 60s cortaria a cada minuto.
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Player web embutido em site de terceiro (alínea c do edital).
        add_header Access-Control-Allow-Origin '*' always;
    }

    # ─────────────────────────────────────────────────────────────────
    # HLS — é o que sustenta "ouvintes ilimitados" (alínea d)
    # ─────────────────────────────────────────────────────────────────
    location /hls/ {
        proxy_pass http://127.0.0.1:8081/hls/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Access-Control-Allow-Origin '*' always;

        # O manifesto muda a cada segmento; os segmentos são imutáveis.
        # Cachear o .m3u8 congelaria a rádio no passado.
        location ~ \.m3u8$ {
            proxy_pass http://127.0.0.1:8081;
            add_header Cache-Control 'no-cache, no-store, must-revalidate' always;
            add_header Access-Control-Allow-Origin '*' always;
        }
        location ~ \.(aac|ts|mp4|m4s)$ {
            proxy_pass http://127.0.0.1:8081;
            # Segmento nomeado nunca muda de conteúdo -> cacheável de verdade.
            # É isto que permite ao CDN/edge absorver a escala.
            add_header Cache-Control 'public, max-age=31536000, immutable' always;
            add_header Access-Control-Allow-Origin '*' always;
        }
    }

    # ─────────────────────────────────────────────────────────────────
    # Painel administrativo + API (alíneas f e g)
    # ─────────────────────────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        # O painel usa WebSocket para o "tocando agora" em tempo real.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
    }

    include %home%/%user%/conf/web/%domain%/nginx.ssl.conf_*;
}
