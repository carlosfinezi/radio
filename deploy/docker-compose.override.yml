# Override de isolamento — Web Rádio Porto do Capim
#
# RAZÃO DE EXISTIR DESTE ARQUIVO:
# O docker-compose.yml padrão do AzuraCast publica 80 e 443 em 0.0.0.0.
# Neste host isso derrubaria o nginx do HestiaCP e, com ele, todos os
# tenants VotoAqui (câmaras municipais) e o liciteagora.
#
# Aqui TODA porta é amarrada a 127.0.0.1. Consequências:
#   1. Zero conflito com o nginx do Hestia (que segue dono de 80/443).
#   2. O firewall do host não é contornado. Portas publicadas pelo Docker
#      entram pela cadeia DOCKER (não pela INPUT), furando o `policy DROP`
#      do Hestia. Ligando só ao loopback, não há o que furar.
#
# O acesso externo passa OBRIGATORIAMENTE pelo vhost do Hestia, que faz
# proxy reverso e termina o TLS.

services:
  web:
    ports:
      # host:porta -> contêiner:porta  (SEMPRE com o 127.0.0.1 na frente)
      - '127.0.0.1:8081:80'
    environment:
      # AzuraCast precisa saber que está atrás de proxy para montar as URLs
      # corretas nos manifestos HLS e nos links do painel.
      AZURACAST_HTTP_PORT: 8081
      AZURACAST_HTTPS_PORT: 0

  stations:
    ports:
      # Faixa de portas das estações (Icecast + harbor do Liquidsoap).
      # 8005 = Icecast da estação porto_do_capim
      # 8010 = harbor (entrada do locutor ao vivo)
      - '127.0.0.1:8005-8025:8005-8025'
