# Override de isolamento — Web Rádio Porto do Capim
#
# ═══════════════════════════════════════════════════════════════════════
# LEIA ANTES DE EDITAR. Este arquivo é a única coisa entre o AzuraCast e
# os sistemas de votação de câmaras municipais que rodam neste host.
# ═══════════════════════════════════════════════════════════════════════
#
# O docker-compose.yml de referência do AzuraCast publica 150 linhas de
# porta no serviço `web`, incluindo:
#     - '${AZURACAST_HTTP_PORT:-80}:${AZURACAST_HTTP_PORT:-80}'
#     - '${AZURACAST_HTTPS_PORT:-443}:${AZURACAST_HTTPS_PORT:-443}'
#     - '8000:8000' ... '8496:8496'
#
# DUAS ARMADILHAS que já custaram uma versão inteira deste arquivo:
#
# 1. `ports` é lista, e listas são CONCATENADAS entre base e override, não
#    substituídas. Escrever `ports: ['127.0.0.1:8081:80']` aqui SOMA uma
#    porta e deixa as 150 originais de pé. Por isso usamos a tag `!override`
#    (Compose >= 2.24), que substitui a lista inteira.
#
# 2. `${AZURACAST_HTTP_PORT}` é interpolado pelo Compose a partir do
#    ambiente ou do arquivo `.env` do projeto — NUNCA de `env_file:`.
#    Escrever a variável em `azuracast.env` não tem efeito nenhum sobre a
#    interpolação: ela cai no default 80. O install.sh grava um `.env`
#    separado justamente por isso.
#
# TERCEIRA CAMADA DE DEFESA, fora deste arquivo: /etc/docker/daemon.json
# com `"ip": "127.0.0.1"`, que faz toda porta publicada sem IP explícito
# nascer no loopback. Se este override for perdido num upgrade, o daemon
# ainda segura.

services:
  web:
    # !override = descarta a lista do arquivo base em vez de somar a ela.
    ports: !override
      - '127.0.0.1:8081:80'      # painel + HLS (proxy do Hestia entra aqui)
      - '127.0.0.1:8005:8005'    # Icecast da estação porto_do_capim
      - '127.0.0.1:8010:8010'    # harbor do Liquidsoap (locutor ao vivo)
      # SFTP e as demais ~145 portas ficam DE FORA de propósito: o que não
      # é publicado não pode vazar. Para habilitar o SFTP de upload de
      # mídia, acrescente aqui explicitamente com o 127.0.0.1 na frente.

    environment:
      # Redundante com o .env, mas deixa o valor visível para quem lê só
      # este arquivo.
      AZURACAST_HTTP_PORT: 8081
      AZURACAST_HTTPS_PORT: 0
