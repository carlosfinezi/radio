name: bitradio
description: BitRádio — rádios ao vivo da plataforma 1bit
publish_to: 'none'
version: 1.0.1+2

environment:
  # just_audio 0.10.6 e audio_service 0.18.19 exigem ambos sdk ^3.6.0 e
  # Flutter >=3.27.0. Declarar 3.4.0 fazia o `pub get` não resolver.
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

  # Reprodução de áudio com suporte a HLS em Android e iOS.
  # Licença Apache-2.0/MIT — sem cláusula comercial.
  just_audio: ^0.10.6

  # Controles de tela de bloqueio, notificação, Android Auto e CarPlay.
  # Licença MIT.
  #
  # NOTA DE LICENCIAMENTO: descartamos react-native-track-player. A v5+ exige
  # licença comercial paga para uso comercial, e este é um contrato
  # remunerado. just_audio (Apache-2.0/MIT) + audio_service (MIT) são as
  # alternativas sem ônus e sem risco jurídico.
  audio_service: ^0.18.19

  # Tratamento de interrupções (ligação telefônica, outro app tomando o
  # áudio, fone desconectado). Sem isto o stream fica mudo após uma chamada
  # e o estado continua dizendo "tocando" — rejeição comum de app de mídia.
  audio_session: ^0.1.21

  http: ^1.2.0
  intl: ^0.19.0

  # Guarda a emissora escolhida no aparelho. Sem persistência, o app
  # perguntaria qual rádio abrir a cada abertura.
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # NÃO declarar `assets:` sem que o diretório exista: o build aborta com
  # "unable to find directory entry in pubspec.yaml". Reative a linha abaixo
  # junto com a criação de app/assets/ (logotipo, ícone da emissora).
  # assets:
  #   - assets/
